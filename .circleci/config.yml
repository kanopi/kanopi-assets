# =============================================================================
# CircleCI — kanopi-assets monorepo: validate + split (Symfony-style)
# =============================================================================
# On every branch/tag: lint the configs (circleci config validate), the YAML
# (yamllint), and the shell scripts (shellcheck). AFTER lint passes, split each
# package directory into its own downstream repo with `git subtree split` (manifest:
# split-packages.txt, logic: bin/monorepo-split.sh): every branch is mirrored
# downstream and stale downstream branches (merged/deleted upstream) are pruned;
# tags propagate. Downstream pushes authenticate with an SSH key (machine user
# with write access to the splits) installed by ci-tools/copy-ssh-key; add it in
# Project Settings -> SSH Keys. The Kanopi orbs are public, so config validation
# needs no token. Downstream repos must already exist.
# =============================================================================
version: 2.1

orbs:
  ci-tools: kanopi/ci-tools@2

jobs:
  lint-circleci:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | sudo bash
      - run:
          name: Validate all CircleCI configs
          command: |
            set -e
            circleci config validate --skip-update-check .circleci/config.yml
            for f in */assets/circleci/config.yml; do
              echo "== ${f} =="
              circleci config validate --skip-update-check "${f}"
            done

  lint-yaml:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install yamllint
          command: pip install --quiet yamllint
      - run:
          name: Validate YAML (configs + tugboat)
          command: |
            yamllint -c .yamllint.yml \
              $(find . \( -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*')

  lint-shell:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install shellcheck
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
      - run:
          name: Shellcheck all scripts
          command: |
            find . \( -name '*.sh' -o -name 'dev-multidev' \) -not -path './.git/*' -print0 \
              | xargs -0 shellcheck

  split:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - ci-tools/copy-ssh-key
      - run:
          name: Split packages into downstream repos
          command: bash ./bin/monorepo-split.sh

workflows:
  validate-and-split:
    jobs:
      - lint-circleci:
          filters:
            tags:
              only: /.*/
      - lint-yaml:
          filters:
            tags:
              only: /.*/
      - lint-shell:
          filters:
            tags:
              only: /.*/
      - split:
          context: kanopi-code
          requires:
            - lint-circleci
            - lint-yaml
            - lint-shell
          filters:
            # All branches mirror downstream; a branch build also prunes stale
            # downstream branches (merged/deleted upstream). Tags propagate too.
            tags:
              only: /.*/
